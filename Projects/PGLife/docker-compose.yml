services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      PORT: 80
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: pglife
      DB_PASSWORD: pglife
      DB_NAME: pglife
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pglife
      MYSQL_USER: pglife
      MYSQL_PASSWORD: pglife
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - pglife_mysql:/var/lib/mysql
      - ./database/pglife.sql:/docker-entrypoint-initdb.d/pglife.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pglife_mysql:
