<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>EduManage Systems</h1>
    </header>

    <main class="login-container">
        <section class="login-box">
            <h2>Welcome Back</h2>
            <p>Please log in to your dashboard.</p>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="userEmail" class="form-label">Email or Phone Number</label>
                    <input type="email" class="form-control" id="userEmail" required placeholder="Enter email or number">
                </div>
                <div class="mb-3">
                    <label for="userPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="userPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn btn-outline-danger w-100" id="googleLoginBtn">
                Sign in with Gmail
            </button>
            
            <div class="mt-3 text-center">
                <a href="#">Forgot Password?</a> | <a href="#">Create Account</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EduManage Systems. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
